name: Docker build & publish (verify)

on:
  push:
    branches: [feat/model-route-shadow-probe]
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "LOWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Resolve Docker tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tags=${{ env.REGISTRY }}/$LOWNER/new-api:${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags<<_MULTILINE" >> "$GITHUB_OUTPUT"
            echo "${{ env.REGISTRY }}/$LOWNER/new-api:mr-verify" >> "$GITHUB_OUTPUT"
            echo "${{ env.REGISTRY }}/$LOWNER/new-api:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "_MULTILINE" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
